<!DOCTYPE html>
<html lang="en">
<script>(function(){try{var p=localStorage.getItem('gl_theme')||'system';var d=p==='system'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',d);}catch(e){}})();</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gharana — Sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B2A5B">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="splash" id="splash">
  <div class="stage">
    <div class="app-name">Gharana</div>
    <div class="tagline">MORTGAGE MANAGEMENT</div>
    <div class="loading-track"><div class="loading-fill"></div></div>
    <div class="loading-text">LOADING...</div>
  </div>
</div>
<script>
  // Only reveal the splash if loading actually takes a moment — fast
  // in-app navigation should feel instant, not stop for a forced animation.
  window.__splashStartTime = Date.now();
  window.__splashRevealTimer = setTimeout(function () {
    var s = document.getElementById("splash");
    if (s) { s.classList.add("splash--visible"); window.__splashRevealedAt = Date.now(); }
  }, 350);
</script>

<div class="login-wrap">
  <div class="login-owl-container" id="loginOwlContainer">
    <dotlottie-wc
      id="loginOwl"
      class="login-owl"
      src="https://lottie.host/c7668bc7-1b61-4958-a268-68939d2ba27a/dhuKIcqJ81.lottie"
      autoplay
      loop
      aria-hidden="true">
    </dotlottie-wc>
  </div>
  <div class="login-card">
    <img src="assets/logo-navy.png" alt="Gharana — Mortgage Management" style="width:100%;max-width:220px;display:block;margin:0 auto 18px;">

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail" data-i18n="login_email">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPass" data-i18n="login_password">Password</label>
        <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="loginError" style="display:none;background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block" data-i18n="login_btn">Sign in</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/login-owl.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => applyTranslations());</script>
<script>
  // Real startup work: resolve auth state, then (if signed in) warm up a
  // genuine Firestore read, so "initial data load resolving" is real —
  // not a fixed timer. hideSplash() (shared, from nav.js) enforces a
  // minimum display time so the animation is always actually visible,
  // even on a fast connection where this resolves in well under a second.
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      try { await db.collection("loans").limit(1).get(); } catch (e) { /* non-blocking */ }
    }
    hideSplash();
  });
</script>
</body>
</html>
