<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gharana — Sign in</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B2A5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ---------- Gharana splash screen (shown until auth check + initial data load resolve) ---------- */
  :root{
    --splash-navy:#0B2A5B;
    --splash-royal:#184A8C;
    --splash-gold:#D4A017;
    --splash-gold-light:#F7CC5F;
    --splash-loading:#E2E8F0;
  }
  .splash{
    position:fixed;inset:0;z-index:9999;
    background:var(--splash-navy);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .splash .stage{position:relative;width:min(90vw, 520px);display:flex;flex-direction:column;align-items:center;}
  .splash .app-name{
    margin-top:28px;font-size:clamp(36px,8vw,52px);font-weight:800;color:#fff;letter-spacing:.5px;
    opacity:0;transform:translateY(12px);animation:splashFadeUp .5s ease-out forwards;animation-delay:.6s;
  }
  .splash .tagline{
    margin-top:6px;display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;letter-spacing:3px;
    color:var(--splash-gold);opacity:0;animation:splashFadeIn .5s ease-out forwards;animation-delay:.85s;
  }
  .splash .tagline::before, .splash .tagline::after{content:"";width:26px;height:1px;background:var(--splash-gold);opacity:.6;}
  @keyframes splashFadeUp{to{opacity:1;transform:translateY(0);}}
  @keyframes splashFadeIn{to{opacity:1;}}
  .splash .loading-track{
    margin-top:40px;width:220px;height:4px;border-radius:100px;background:rgba(24,74,140,.6);overflow:hidden;
    opacity:0;animation:splashFadeIn .3s ease-out forwards;animation-delay:.9s;
  }
  .splash .loading-fill{
    height:100%;width:25%;border-radius:100px;background:linear-gradient(90deg, var(--splash-gold-light), var(--splash-gold));
    animation:splashLoadingPulse 1.2s ease-in-out infinite;animation-delay:.9s;
  }
  @keyframes splashLoadingPulse{0%,100%{width:25%;}50%{width:75%;}}
  .splash .loading-text{
    margin-top:14px;font-size:11px;letter-spacing:4px;color:var(--splash-loading);
    opacity:0;animation:splashFadeIn .5s ease-out forwards;animation-delay:1s;
  }
  .splash--exit .loading-fill{animation:none;width:100% !important;transition:width .25s ease-out;}
  .splash--exit{animation:splashFadeOut .3s ease-in forwards;animation-delay:.25s;}
  @keyframes splashFadeOut{to{opacity:0;}}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="stage">
    <div class="app-name">Gharana</div>
    <div class="tagline">MORTGAGE MANAGEMENT</div>
    <div class="loading-track"><div class="loading-fill"></div></div>
    <div class="loading-text">LOADING...</div>
  </div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <img src="assets/logo-navy.png" alt="Gharana — Mortgage Management" style="width:100%;max-width:220px;display:block;margin:0 auto 18px;">

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail" data-i18n="login_email">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPass" data-i18n="login_password">Password</label>
        <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="loginError" style="display:none;background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block" data-i18n="login_btn">Sign in</button>
    </form>
    <p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:18px;">
      Accounts are created in Firebase Console for you and your father.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => applyTranslations());</script>
<script>
  // Call window.gharanaSplashDone() once real startup work is ready.
  // It completes the loading bar, stops the ring, and fades the splash out —
  // revealing the login form underneath (auth.js above already handles
  // redirecting straight to the dashboard if the person turns out to be
  // signed in, so the splash just needs to cover that check happening).
  window.gharanaSplashDone = function (onComplete) {
    const splash = document.getElementById('splash');
    splash.classList.add('splash--exit');
    setTimeout(() => {
      splash.style.display = 'none';
      if (typeof onComplete === 'function') onComplete();
    }, 600); // matches 250ms bar-complete + 300ms fade + buffer
  };

  // Real startup work: resolve auth state, then (if signed in) warm up a
  // genuine Firestore read, so "initial data load resolving" is real —
  // not a fixed timer. No more 4-second demo setTimeout.
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      try { await db.collection("loans").limit(1).get(); } catch (e) { /* non-blocking */ }
    }
    window.gharanaSplashDone();
  });
</script>
</body>
</html>
