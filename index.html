<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gharana Ledger — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="mark">Gharana Ledger</div>
    <div class="tag">Gold &amp; Silver Loan Register</div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username" placeholder="you@shahjewellers.in">
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div id="loginError" style="display:none;background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:18px;">
      Accounts are created in Firebase Console for you and your father.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
