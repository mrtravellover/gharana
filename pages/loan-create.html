<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Loan — Gharana Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="stagedContent">
  <form id="loanForm">
    <div class="card">
      <h2>1. Customer &amp; loan details</h2>
      <div class="divider-dashed"></div>
      <div class="field">
        <label>Customer *</label>
        <select id="customerSelect" required><option value="">Select customer…</option></select>
        <div class="hint">Can't find them? <a href="customers.html?new=1">Add a new customer first →</a></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>Loan / receipt number *</label><input type="text" id="loanNumber" required placeholder="e.g. SJ-2026-014"></div>
        <div class="field"><label>Loan date *</label><input type="date" id="loanDate" required></div>
      </div>
      <div class="field">
        <label>Ornament belongs to *</label>
        <div style="display:flex;gap:16px;align-items:center;margin-bottom:8px;">
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);"><input type="radio" name="pledgedByMode" value="self" checked style="width:auto;"> Self (the account holder)</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);"><input type="radio" name="pledgedByMode" value="other" style="width:auto;"> Someone else</label>
        </div>
        <input type="text" id="pledgedByName" placeholder="e.g. Ramesh" style="display:none;">
        <div class="hint" id="pledgedByHint"></div>
      </div>
      <div class="field"><label>Remarks</label><textarea id="loanRemarks" placeholder="Any notes about this loan…"></textarea></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="section-head">
        <h2>2. Ornaments pledged</h2>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addOrnamentRow()">+ Add item</button>
      </div>
      <div class="divider-dashed"></div>
      <div id="ornamentRows"></div>
      <div class="hint" id="ornamentTotals" style="margin-top:8px;font-weight:600;"></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>3. First disbursement</h2>
      <div class="divider-dashed"></div>
      <div class="grid grid-3">
        <div class="field"><label>Amount given (₹) *</label><input type="number" id="disbAmount" required min="1" step="1"></div>
        <div class="field"><label>Monthly interest rate (%) *</label><input type="number" id="disbRate" required min="0" step="0.1" placeholder="e.g. 2.5"></div>
        <div class="field"><label>Date given *</label><input type="date" id="disbDate" required></div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>Reason for amount</label><input type="text" id="disbReason" placeholder="e.g. shop expenses"></div>
        <div class="field"><label>Collected by (family member)</label><input type="text" id="disbCollector" placeholder="e.g. Kavish"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="disbNotes"></textarea></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;">
      <a href="loans.html" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary" id="saveLoanBtn">Create loan</button>
    </div>
  </form>
</div>

<template id="ornamentRowTemplate">
  <div class="item-row" data-row>
    <div class="field" style="flex:1.3;">
      <label>Item</label>
      <input type="text" class="orn-name" placeholder="e.g. Kada, Chain, Payal" required>
    </div>
    <div class="field">
      <label>Metal</label>
      <select class="orn-metal">
        <option value="Gold">Gold</option>
        <option value="Silver">Silver</option>
      </select>
    </div>
    <div class="field">
      <label>Weight (g)</label>
      <input type="number" class="orn-weight" min="0" step="0.01" required>
    </div>
    <div class="field" style="max-width:80px;">
      <label>Qty</label>
      <input type="number" class="orn-qty" min="1" step="1" value="1" required>
    </div>
    <div class="field orn-purity-field">
      <label>Purity</label>
      <input type="number" class="orn-purity" min="0" max="100" step="0.1" placeholder="e.g. 70">
    </div>
    <div class="field orn-category-field" style="max-width:100px;">
      <label>Category</label>
      <input type="text" class="orn-category" readonly placeholder="—">
    </div>
    <button type="button" class="btn btn-ghost btn-sm remove" onclick="this.closest('[data-row]').remove(); updateOrnamentTotals();">✕</button>
  </div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/interest.js"></script>
<script src="../js/loan-create.js"></script>
</body>
</html>
