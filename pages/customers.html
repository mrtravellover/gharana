<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers — Gharana Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="stagedContent">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by name, mobile, Aadhaar, or village…">
    <button class="btn btn-primary" onclick="openCustomerModal()">+ Add customer</button>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <table>
      <thead><tr><th>Name</th><th>Mobile</th><th>Village</th><th>Loans</th></tr></thead>
      <tbody id="customerBody"><tr><td colspan="4" style="color:var(--ink-soft);padding:20px 0;">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Add Customer Modal -->
<div class="modal-overlay" id="customerModal" style="display:none;">
  <div class="modal">
    <h2>New customer</h2>
    <form id="customerForm">
      <div class="field"><label>Full name *</label><input type="text" id="custName" required></div>
      <div class="grid grid-2">
        <div class="field"><label>Mobile number *</label><input type="tel" id="custMobile" required pattern="[0-9]{10}" placeholder="9876543210"></div>
        <div class="field"><label>Aadhaar number</label><input type="text" id="custAadhaar" maxlength="12" placeholder="XXXX XXXX XXXX"></div>
      </div>
      <div class="field"><label>Address / village *</label><input type="text" id="custAddress" required></div>
      <div class="field"><label>Notes / remarks</label><textarea id="custNotes"></textarea></div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button type="button" class="btn btn-secondary btn-block" onclick="closeCustomerModal()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block" id="saveCustBtn">Save customer</button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/customers.js"></script>
</body>
</html>
