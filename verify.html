<!DOCTYPE html>
<html lang="en">
<script>(function(){try{var p=localStorage.getItem('gl_theme')||'system';var d=p==='system'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',d);}catch(e){}})();</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Verification — Gharana</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<meta name="theme-color" content="#0B2A5B">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg);}
  .verify-card{max-width:380px;width:100%;background:var(--paper);border-radius:16px;box-shadow:0 10px 40px rgba(11,42,91,.12);padding:32px 28px;text-align:center;}
  .verify-logo{height:48px;margin-bottom:10px;object-fit:contain;}
  .verify-shopname{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:22px;}
  .verify-status-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px;}
  .verify-status-icon.ok{background:var(--good-soft);color:var(--good);}
  .verify-status-icon.bad{background:var(--warn-soft);color:var(--warn);}
  .verify-status-title{font-size:19px;font-weight:700;margin-bottom:6px;}
  .verify-status-title.ok{color:var(--good);}
  .verify-status-title.bad{color:var(--warn);}
  .verify-status-sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:22px;}
  .verify-details{background:var(--paper-soft);border-radius:10px;padding:16px;text-align:left;}
  .verify-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line);}
  .verify-row:last-child{border-bottom:none;}
  .verify-row .l{color:var(--ink-soft);}
  .verify-row .v{font-weight:700;color:var(--ink);}
  .verify-footer{margin-top:22px;font-size:11.5px;color:var(--ink-soft);}
  .verify-loading{color:var(--ink-soft);font-size:14px;padding:30px 0;}
</style>
</head>
<body>
  <div class="verify-card" id="verifyCard">
    <div class="verify-loading">Checking receipt…</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
