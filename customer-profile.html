<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Profile — Gharana Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stagedContent">
  <div class="grid grid-2">
    <div class="card" id="profileCard">Loading…</div>
    <div class="card">
      <h2>Notes</h2>
      <p id="profileNotes" style="color:var(--ink-soft);">—</p>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div class="section-head">
      <h2>Loans</h2>
      <a href="#" id="newLoanLink" class="btn btn-primary btn-sm">+ New loan</a>
    </div>
    <table>
      <thead><tr><th>Loan #</th><th>Date</th><th>Principal</th><th>Status</th></tr></thead>
      <tbody id="loanBody"><tr><td colspan="4" style="color:var(--ink-soft);padding:20px 0;">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/interest.js"></script>
<script src="js/customer-profile.js"></script>
</body>
</html>
